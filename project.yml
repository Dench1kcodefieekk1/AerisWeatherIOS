name: Aeris
options:
  bundleIdPrefix: com.aeris
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  Aeris:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Aeris
        excludes:
          - Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aeris.weather
        INFOPLIST_FILE: Aeris/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Aeris/Resources/Aeris.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Aeris/Resources/Info.plist
    dependencies:
      - target: AerisWidgetExtension
        embed: true

  AerisWidgetExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AerisWidget
        excludes:
          - Info.plist
      - path: Aeris/Core/Weather/Models
      - path: Aeris/Core/Weather/Services
      - path: Aeris/Core/Weather/Repository
      - path: Aeris/Core/Visualization/WeatherIconView.swift
      - path: Aeris/Utilities/UnitsFormatter.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aeris.weather.widget
        INFOPLIST_FILE: AerisWidget/Info.plist
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: AerisWidget/Info.plist

  AerisTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AerisTests
    dependencies:
      - target: Aeris
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aeris.weather.tests
